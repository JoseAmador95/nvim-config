name: Check Neovim config

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvim-config-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Neovim 0.12.4 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    env:
      NVIM_CONFIG_CHECK_TIMEOUT: "120"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7
        with:
          version: v0.12.4
          neovim: true

      - name: Prepare isolated paths
        run: |
          printf 'NVIM_CONFIG_XDG_ROOT=%s/nvim-config-xdg\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'NVIM_CONFIG_TOOLS_BIN=%s/nvim-config-tools/bin\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Restore plugin and parser cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ env.NVIM_CONFIG_XDG_ROOT }}/data
            ${{ runner.temp }}/nvim-config-tools
          key: nvim-${{ runner.os }}-0.12.4-${{ hashFiles('lazy-lock.json', 'lua/plugins/treesitter.lua', 'lua/config/toolchain.lua') }}

      - name: Install pinned validation tools
        run: |
          ./scripts/install-ci-tools "$NVIM_CONFIG_TOOLS_BIN"
          printf '%s\n' "$NVIM_CONFIG_TOOLS_BIN" >> "$GITHUB_PATH"

      - name: Restore locked plugins and parsers
        run: ./scripts/bootstrap-config --xdg-root "$NVIM_CONFIG_XDG_ROOT"

      - name: Run canonical checks
        run: ./scripts/check-config
